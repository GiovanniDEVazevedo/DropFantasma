<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Hunter</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>

    <h1>Soul Hunter</h1>

    <button onclick="iniciarCaptura()">
        Capturar Fantasma
    </button>

    <h2>
        Pontos:
        <span id="pontos">0</span>
    </h2>

    <button onclick="trocarRepetidos()">
        Trocar Repetidos por Pontos
    </button>

    <button onclick="abrirMercado()">
        Mercado
    </button>

    <div id="colecao">
        <button>Ver colecao</button>
    </div>

    <div id="modal-captura" class="modal-overlay">
        <div class="modal-caixa">
            <button class="modal-fechar" onclick="fecharModal()">&times;</button>
            <h3 id="modal-titulo">Fantasma Capturado</h3>
            <img id="modal-imagem" src="" alt="">
            <p id="modal-mensagem"></p>
            <button class="modal-ok" onclick="fecharModal()">Fechar</button>
        </div>
    </div>

    <div id="modal-mercado" class="modal-overlay">
        <div class="modal-caixa">
            <button class="modal-fechar" onclick="fecharMercado()">&times;</button>
            <h3>Mercado de Itens</h3>
            <p id="mercado-pontos"></p>
            <div id="mercado-lista"></div>
            <button class="modal-ok" onclick="fecharMercado()">Fechar</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
